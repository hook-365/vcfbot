[project]
name = "vcfbot"
version = "0.1.0"
description = "Local RAG chatbot over Broadcom / VMware Cloud Foundation techdocs PDFs."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anthony Hook" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "click>=8.4.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "pymupdf>=1.27.2.3",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
]

[project.scripts]
vcfbot = "vcfbot:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
